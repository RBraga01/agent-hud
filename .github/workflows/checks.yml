name: checks

# The Raven Framework is deliberately NOT installed here. It is proprietary and
# its licence grants no right to use it, so it must never be pulled into public
# automation. The screen tests skip without it; everything else runs, which is
# why the logic lives outside the screen in the first place.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the project supports. 3.12 is what the glasses run.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # dev for the tools, gateway for webauthn and cryptography: the
        # off-loopback pairing and TLS tests are real integration tests and
        # need the real libraries. Nothing here reaches the glasses.
        run: pip install -e ".[dev,gateway]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --cov --cov-report=term

      - name: Check the framework was not committed
        run: |
          if [ -e raven-framework ]; then
            echo "The Raven Framework is proprietary and must never be committed."
            exit 1
          fi
          if git ls-files | grep -qi 'raven_framework/'; then
            echo "Framework source found in the repository. Remove it."
            exit 1
          fi
          echo "Clean."

      - name: Check platform and deploy boundaries
        run: pytest -q tests/test_platform_layout.py tests/test_deploy_surface.py

      - name: Check public-repository hygiene
        run: pytest -q tests/test_publication_hygiene.py

  halo-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.17

      - name: Fetch the pinned Brilliant SDK
        working-directory: platforms/halo
        run: |
          git clone --filter=blob:none https://github.com/brilliantlabsAR/brilliant_sdk.git vendor/brilliant_sdk
          git -C vendor/brilliant_sdk checkout f582b88bee798121c51bc483c2b0b4a85dd5e411

      - name: Install the Halo test environment
        working-directory: platforms/halo
        run: python -m uv sync --frozen

      - name: Test the Halo app in the emulator
        working-directory: platforms/halo
        run: python -m uv run pytest -q

      - name: Check generated files stay outside version control
        run: git diff --exit-code

  memomind-sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install test dependency
        run: python -m pip install pytest PyNaCl

      - name: Fetch the pinned MemoMind public SDK
        run: |
          git clone --filter=blob:none https://github.com/memomind-open/plugin-open-platform.git platforms/memomind/vendor/plugin-open-platform
          git -C platforms/memomind/vendor/plugin-open-platform checkout f74ee53eb70b008e665adfd81ff8a78a344a4ecb

      - name: Test MemoMind protocol, core, adapters and guards
        working-directory: platforms/memomind
        run: |
          npm test
          python -m pytest tests -q

      - name: Build the glasses package with the official SDK
        run: python platforms/memomind/vendor/plugin-open-platform/GlassSDK/build.py build --project platforms/memomind/glasses

      - name: Build the phone package
        run: |
          mkdir -p platforms/memomind/phone/vendor platforms/memomind/artifacts
          cp platforms/memomind/vendor/plugin-open-platform/PhoneSDK/examples/life-desk/vendor/gm-plugin-web-sdk.esm.js platforms/memomind/phone/vendor/
          node platforms/memomind/vendor/plugin-open-platform/PhoneSDK/tools/build-mmpkg.mjs platforms/memomind/phone platforms/memomind/artifacts/agent-hud.mmpkg

      - name: Check paired package metadata
        run: python platforms/memomind/vendor/plugin-open-platform/.agents/skills/memomind-example-app/scripts/check_pair.py --web platforms/memomind/artifacts/agent-hud.mmpkg --glass platforms/memomind/glasses/manifest.json --gmp platforms/memomind/glasses/.build/glasses/glasses.gmp

      - name: Check generated files stay outside version control
        run: git diff --exit-code

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Guard against the framework or a bare .env
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo ".env must not be committed."
            exit 1
          fi
          if git ls-files | grep -qi 'raven[-_]framework/'; then
            echo "Raven Framework source found in the repository."
            exit 1
          fi
          if git ls-files | grep -qi '^platforms/halo/vendor/'; then
            echo "Brilliant SDK source found in the repository."
            exit 1
          fi
          if git ls-files | grep -qi '^platforms/memomind/vendor/'; then
            echo "MemoMind SDK source found in the repository."
            exit 1
          fi
          echo "Clean."
