name: checks

# The Raven Framework is deliberately NOT installed here. It is proprietary and
# its licence grants no right to use it, so it must never be pulled into public
# automation. The screen tests skip without it; everything else runs, which is
# why the logic lives outside the screen in the first place.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the project supports. 3.12 is what the glasses run.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --cov --cov-report=term

      - name: Check the framework was not committed
        run: |
          if [ -e raven-framework ]; then
            echo "The Raven Framework is proprietary and must never be committed."
            exit 1
          fi
          if git ls-files | grep -qi 'raven_framework/'; then
            echo "Framework source found in the repository. Remove it."
            exit 1
          fi
          echo "Clean."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Guard against the framework or a bare .env
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo ".env must not be committed."
            exit 1
          fi
          if git ls-files | grep -qi 'raven[-_]framework/'; then
            echo "Raven Framework source found in the repository."
            exit 1
          fi
          echo "Clean."
