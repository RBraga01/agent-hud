<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>Agent HUD Control</title>
<link rel="manifest" href="/control/manifest.webmanifest">
<style>
/* Agent HUD Control.
   Served by your own gateway, over your own network. It talks to nothing
   else: no analytics, no fonts from elsewhere, no cloud. That is why
   everything here is one file with no dependencies. */

:root {
  --ground:   #080c14;
  --panel:    #0e1622;
  --line:     #1c2b40;
  --accent:   #2f9bff;
  --accent-d: #17466f;
  --text:     #e8eef7;
  --dim:      #8296b0;
  --good:     #35d07f;
  --warn:     #ffcc44;
  --bad:      #ff6b5e;
  --radius:   14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 0 0 40px;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px 14px;
  position: sticky;
  top: 0;
  background: linear-gradient(var(--ground) 70%, transparent);
  z-index: 5;
}
header .mark {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(47,155,255,.65);
  flex: none;
}
header h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .2px; }
header .spacer { flex: 1; }

main {
  display: grid;
  gap: 14px;
  padding: 0 16px;
  max-width: 1120px;
  margin: 0 auto;
}
@media (min-width: 860px) { main { grid-template-columns: 1fr 1fr; align-items: start; } }

section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px 16px;
}
section > h2 {
  font-size: 11px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--dim);
  margin: 0 0 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
}
section > h2 .more { margin-left: auto; color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 500; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}
.row:first-of-type { border-top: 0; }
.row .icon { width: 26px; flex: none; color: var(--accent); display: grid; place-items: center; }
.row .body { min-width: 0; flex: 1; }
.row .body .name { font-weight: 600; }
.row .body .sub { color: var(--dim); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chev { color: var(--dim); flex: none; }
.row.tappable { cursor: pointer; }
.row.tappable:hover { background: rgba(47,155,255,.06); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.tile {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  text-align: center;
}
.tile .label { color: var(--dim); font-size: 13px; }
.tile .value { font-size: 30px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot.good { background: var(--good); box-shadow: 0 0 8px rgba(53,208,127,.7); }
.dot.bad  { background: var(--bad);  box-shadow: 0 0 8px rgba(255,107,94,.7); }
.dot.warn { background: var(--warn); }

.state { color: var(--good); font-size: 13.5px; }
.state.bad { color: var(--bad); }

.draft {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--text);
}
.draft textarea {
  width: 100%;
  background: transparent;
  border: 0;
  color: inherit;
  font: inherit;
  resize: vertical;
  min-height: 52px;
  padding: 0;
}
.draft textarea:focus { outline: none; }

.buttons { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
button {
  font: inherit;
  font-weight: 600;
  letter-spacing: .4px;
  text-transform: uppercase;
  font-size: 12.5px;
  padding: 10px 16px;
  border-radius: 9px;
  border: 1px solid var(--accent-d);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; }
button.primary:hover { filter: brightness(1.1); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, .row.tappable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toggle {
  width: 46px; height: 26px; border-radius: 13px;
  border: 1px solid var(--line);
  background: #16202e;
  position: relative; cursor: pointer; flex: none;
  transition: background .15s;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--dim); transition: transform .15s, background .15s;
}
.toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }

.value-right { color: var(--dim); margin-left: auto; }

footer {
  text-align: center;
  color: var(--dim);
  font-size: 12.5px;
  padding: 26px 16px 0;
}

dialog {
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; max-width: 460px; width: calc(100% - 32px);
}
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h3 { margin: 0 0 8px; font-size: 17px; }
dialog p { color: var(--dim); margin: 0 0 4px; }

.empty { color: var(--dim); padding: 6px 0 2px; }
.err { color: var(--bad); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header>
  <span class="mark" aria-hidden="true"></span>
  <h1>Agent HUD Control</h1>
  <span class="spacer"></span>
  <button id="refresh" title="Refresh now">Refresh</button>
</header>

<main>
  <section id="status-card">
    <h2>Status</h2>
    <div class="row">
      <span class="icon" aria-hidden="true">&#9679;</span>
      <div class="body"><div class="name">Gateway: <span id="gw-name">&mdash;</span></div></div>
      <span class="state" id="gw-state"><span class="dot warn"></span>Checking</span>
    </div>
    <div class="row">
      <span class="icon" aria-hidden="true">&#9678;</span>
      <div class="body"><div class="name">Raven Prism</div></div>
      <span class="state" id="device-state"><span class="dot warn"></span>Unknown</span>
    </div>
    <div class="tiles">
      <div class="tile"><div class="label">Needs you</div><div class="value" id="tile-needs">&mdash;</div></div>
      <div class="tile"><div class="label">Pending drafts</div><div class="value" id="tile-drafts">0</div></div>
    </div>
  </section>

  <section id="tasks-card">
    <h2>Tasks <span class="more" id="tasks-more"></span></h2>
    <div id="tasks"><div class="empty">Loading&hellip;</div></div>
  </section>

  <section id="pending-card" hidden>
    <h2>Pending draft</h2>
    <div class="draft">
      <textarea id="draft-text" aria-label="Draft response"></textarea>
    </div>
    <div class="buttons">
      <button id="draft-discard">Discard</button>
      <button id="draft-send" class="primary">Send</button>
    </div>
  </section>

  <section id="devices-card">
    <h2>Devices</h2>
    <div class="row">
      <span class="icon" aria-hidden="true">&#9678;</span>
      <div class="body"><div class="name">Raven Prism</div></div>
      <span class="state" id="device-seen">&mdash;</span>
    </div>
  </section>

  <section id="sources-card">
    <h2>Sources</h2>
    <div id="sources"><div class="empty">Loading&hellip;</div></div>
  </section>

  <section id="settings-card">
    <h2>Settings</h2>
    <div id="settings"><div class="empty">Loading&hellip;</div></div>
  </section>
</main>

<footer>
  Local-first &middot; Private by design &middot; No cloud
</footer>

<dialog id="task-dialog">
  <h3 id="dlg-title">Task</h3>
  <p id="dlg-source"></p>
  <p id="dlg-detail" style="color:var(--text); white-space:pre-wrap; margin:12px 0"></p>
  <div class="buttons" id="dlg-actions"></div>
  <div class="buttons"><button id="dlg-close">Close</button></div>
</dialog>

<dialog id="confirm-dialog">
  <h3>Confirm</h3>
  <p id="confirm-what"></p>
  <div class="buttons">
    <button id="confirm-cancel">Cancel</button>
    <button id="confirm-ok" class="primary">Confirm</button>
  </div>
</dialog>

<script src="/control/control.js"></script>
</body>
</html>
